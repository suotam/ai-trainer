openapi: 3.0.3
info:
  title: AI Trainer API
  description: >
    Kanonický veřejný HTTP kontrakt AI Traineru. Zdrojem transportního
    kontraktu je tento soubor (APR-001); doménový význam vlastní doménové
    dokumenty. Pro R0 obsahuje pouze health endpointy podle
    docs/07-backend/r0-api-contract.md.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development (bez produkčních hodnot)
tags:
  - name: Health
    description: Technické liveness a readiness endpointy (bez autentizace).
  - name: Auth
    description: >
      R2 autentizační operace podle docs/07-backend/r2-auth-api-contract.md
      (C4). Server je autorita identity a session (AAC-004); citlivé
      credentials nikdy v URL ani v logu (AAC-009).
  - name: Profile
    description: >
      R2 baseline AthleteProfile (C6 §8.1). Ownership vynucuje server
      (AOC-002/004); cizí a neexistující profil jsou nerozlišitelné 404
      (AOC-007).
  - name: Device
    description: >
      R2 registrace zařízení (C9): idempotentní upsert client-generated
      installation ID, kolekce filtrovaná principalem (AOC-008),
      minimalizovaná metadata (DRC-011).
  - name: Sync
    description: >
      R2-05 push synchronizace (C10): ORDERED_OPERATIONS batch podle
      sequence, per-item výsledky, potvrzení po serverovém commitu
      (SPC-005), idempotentní replay (C11).
paths:
  /api/v1/health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      description: >
        Ověřuje pouze, že proces běží a HTTP vrstva odpovídá. Nesmí selhat
        kvůli nedostupné externí závislosti (APR-003). Bez side effects
        (APR-010).
      responses:
        "200":
          description: Proces je spuštěný a schopný obsloužit HTTP request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        "500":
          description: Neočekávaná interní chyba.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: >
        Ověřuje připravenost instance přijímat provoz podle povinných
        závislostí aktuálního prostředí. Objekt `checks` je rozšiřitelný —
        další povinné závislosti (např. database, migrations v R0-05) se
        přidávají bez breaking změny kontraktu.
      responses:
        "200":
          description: Instance je připravená přijímat provoz.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Instance není připravená přijímat provoz.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Neočekávaná interní chyba.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/registrations:
    post:
      tags: [Auth]
      operationId: registerAccount
      summary: Registrace účtu (anonymous → account upgrade boundary)
      description: >
        Vytvoří účet z first-party credential (ADR-011 baseline) a vydá
        aplikační access/refresh session. Vyžaduje Idempotency-Key
        (AAC-005) — opakování se stejným klíčem a stejným payloadem
        nevytvoří druhý účet a vrátí účet existující. Operace potvrzuje
        pouze identity binding; přenos lokálních dat vlastní C15 (AAC-015).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Účet vytvořen (nebo idempotentně potvrzen) a session vydána.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "409":
          description: "Kolize přihlašovací identity (code: DUPLICATE_LOGIN_IDENTITY)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/auth/sessions:
    delete:
      tags: [Auth]
      operationId: revokeAllSessions
      summary: Globální revokace — odhlásit všude (C13)
      description: >
        Revokuje všechny auth session účtu včetně volající (RVC-001/006);
        odpověď je poslední autorizovaná akce této session. Idempotentní
        (RVC-004). Ruší výhradně oprávnění, žádná data (RVC-005).
      security:
        - accessSession: []
      responses:
        "204":
          description: Všechny session účtu revokovány (nebo už byly).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/AuthInternalError"
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Přihlášení a vydání access/refresh session
      description: >
        Ověří first-party credential a vydá novou aplikační session.
        Chyba přihlášení je generická INVALID_CREDENTIALS bez account
        enumeration (AAC-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session vydána.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          description: "Neplatné přihlašovací údaje (code: INVALID_CREDENTIALS)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            Účet nedovoluje přihlášení (code: ACCOUNT_DISABLED nebo
            ACCOUNT_DELETED), bez odhalení detailu.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/auth/sessions/refresh:
    post:
      tags: [Auth]
      operationId: refreshAuthSession
      summary: Obnova access session rotující refresh credential
      description: >
        Vydá novou access credential a rotuje refresh credential (AAC-006).
        Replay již rotované/revokované refresh credential je detekován a
        odmítnut (INVALID_REFRESH / SESSION_REVOKED); detekovaný replay
        revokuje celou session. Refresh credential se přenáší výhradně
        v request body — nikdy v URL (AAC-009, AAC-010).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Access session obnovena, refresh credential rotována.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          description: >
            Neplatná/expirovaná/rotovaná refresh credential (code:
            INVALID_REFRESH) nebo revokovaná session (code: SESSION_REVOKED).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Účet nedovoluje obnovu (code: ACCOUNT_DISABLED / ACCOUNT_DELETED)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/auth/sessions/current:
    delete:
      tags: [Auth]
      operationId: logoutCurrentSession
      summary: Odhlášení — ukončení aktuální session
      description: >
        Revokuje session příslušnou k předložené access credential.
        Opakovaný logout na již ukončené session je idempotentní no-op.
      security:
        - accessSession: []
      responses:
        "204":
          description: Session ukončena (nebo již byla ukončena — no-op).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSessionContext
      summary: Serverem autoritativní session context (current principal)
      description: >
        Vrátí principal a stav session odvozený serverem z ověřené access
        credential (AAC-004). Bezpečná read operace bez side effects.
      security:
        - accessSession: []
      responses:
        "200":
          description: Aktivní session context.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContextResponse"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/profiles:
    post:
      tags: [Profile]
      operationId: createProfile
      summary: Vytvoření R2 baseline AthleteProfile
      description: >
        Vytvoří SELF profil vlastněný principalem (AOC-005) s client-generated
        profileId, který server zachovává (SDM-005). Retry se stejným
        profileId je idempotentní (200); druhý SELF profil na účet je
        odmítnut (PROFILE_ALREADY_EXISTS).
      security:
        - accessSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Profil vytvořen.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "200":
          description: Idempotentní retry — profil se stejným ID už patří principalu.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "409":
          description: "Účet už má profil (code: PROFILE_ALREADY_EXISTS)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/profiles/current:
    get:
      tags: [Profile]
      operationId: getCurrentProfile
      summary: SELF profil principala
      security:
        - accessSession: []
      responses:
        "200":
          description: SELF profil principala.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "404":
          $ref: "#/components/responses/OwnedResourceNotFound"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/profiles/{profileId}:
    get:
      tags: [Profile]
      operationId: getProfileById
      summary: Profil podle ID s ownership vynucením
      description: >
        Cizí a neexistující profil jsou navenek nerozlišitelné — obojí 404
        (AOC-007, anti-IDOR).
      security:
        - accessSession: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vlastní profil.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "404":
          $ref: "#/components/responses/OwnedResourceNotFound"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/devices/{installationId}:
    delete:
      tags: [Device]
      operationId: revokeDevice
      summary: Revokace instalace (C13)
      description: >
        Revokuje registrovanou instalaci principala a všechny na ni vázané
        auth session (RVC-002); revokovaná instalace nepushuje ani se tiše
        nereaktivuje (DRC-013). Cizí a neexistující instalace jsou shodně
        404 (RVC-003); opakování je idempotentní no-op (RVC-004).
      security:
        - accessSession: []
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Instalace revokována (nebo už byla).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "404":
          $ref: "#/components/responses/OwnedResourceNotFound"
        "500":
          $ref: "#/components/responses/AuthInternalError"
    put:
      tags: [Device]
      operationId: registerDevice
      summary: Idempotentní registrace instalace zařízení
      description: >
        Upsert podle přirozeného klíče (principal, installationId) — DRC-006;
        opakovaná registrace aktualizuje metadata a nevytvoří duplikát.
        Registrace aditivně naváže aktuální auth session na instalaci
        (C9 §6). Installation ID je client-generated a server jej zachovává
        (DRC-001).
      security:
        - accessSession: []
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Instalace registrována poprvé.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "200":
          description: Idempotentní re-registrace — metadata aktualizována.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "409":
          description: "Instalace je revokovaná (code: DEVICE_REVOKED)."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/devices:
    get:
      tags: [Device]
      operationId: listDevices
      summary: Zařízení principala
      description: Kolekce je implicitně filtrovaná principalem (AOC-008).
      security:
        - accessSession: []
      responses:
        "200":
          description: Registrovaná zařízení principala.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/sync/push:
    post:
      tags: [Sync]
      operationId: pushSyncOperations
      summary: Push batch lokálních operací (R2-05, C10)
      description: >
        Aplikuje operace jednoho zařízení v pořadí sequence (SPC-003);
        ownership, validace, verze i idempotence se vyhodnocují per položka
        (SPC-004) — selhání položky nezastaví batch a HTTP 200 nepotvrzuje
        odmítnuté položky. Klient smí označit operaci za synchronizovanou
        výhradně na základě SUCCESS/ALREADY_APPLIED (SPC-005).
      security:
        - accessSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Per-item výsledky batch (i s odmítnutými položkami).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "500":
          $ref: "#/components/responses/AuthInternalError"
  /api/v1/ai/plan-proposals:
    post:
      tags: [Ai]
      operationId: requestPlanProposal
      summary: Strukturovaný AI návrh plánu (R4-03, C28)
      description: >
        Jediný AI endpoint (AGW-001). Minimalizovaný AIContext (C27) →
        gateway → model → deterministická validace proti verzovanému
        schématu (C28). Nevalidní výstup modelu se nikdy nevrací jako
        úspěch (AI_INVALID_OUTPUT); selhání providera je AI_UNAVAILABLE.
        Návrh je pouze návrh — doménovou změnu provádí až potvrzený
        ChangeSet (R4P-001).
      security:
        - accessSession: []
      requestBody:
        required: true
        content:
          application\json:
            schema:
              $ref: "#/components/schemas/PlanProposalRequest"
      responses:
        "200":
          description: Validovaný kanonický návrh s trojicí verzí (PAA-005).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application\json:
              schema:
                $ref: "#/components/schemas/PlanProposalResponse"
        "400":
          $ref: "#/components/responses/AuthBadRequest"
        "401":
          $ref: "#/components/responses/AuthUnauthorized"
        "500":
          $ref: "#/components/responses/AuthInternalError"
components:
  securitySchemes:
    accessSession:
      type: http
      scheme: bearer
      description: >
        Krátce žijící aplikační access credential v Authorization headeru;
        nikdy v URL (AAC-009). Vydává a validuje ji výhradně backend
        (ADR-011).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Klientem generovaný stabilní idempotency key account-creating
        operace (AAC-005). Opakování se stejným klíčem a payloadem
        nevytvoří druhý účet.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]{8,128}$"
  responses:
    AuthBadRequest:
      description: "Neplatný request (code: INVALID_REQUEST)."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthUnauthorized:
      description: >
        Chybějící/expirovaná access credential (code: ACCESS_SESSION_EXPIRED)
        nebo revokovaná session (code: SESSION_REVOKED).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthRateLimited:
      description: "Abuse protection (code: RATE_LIMITED); respektovat Retry-After."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          description: Doporučený počet sekund před dalším pokusem.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthInternalError:
      description: Neočekávaná interní chyba.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OwnedResourceNotFound:
      description: >
        Zdroj neexistuje nebo nepatří principalu — navenek nerozlišitelné
        (code: RESOURCE_NOT_FOUND, AOC-007).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  headers:
    XRequestId:
      description: >
        Korelační identifikátor odpovědi (APR-007). Server vrátí validní
        příchozí hodnotu, jinak vygeneruje vlastní neprůhledný identifikátor.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    CacheControlNoStore:
      description: Health odpovědi jsou necacheovatelné (APR-009).
      schema:
        type: string
        enum: [no-store]
  schemas:
    LivenessResponse:
      type: object
      required: [status, service, timestamp, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [UP]
          description: Pro R0 vždy UP při odpovědi 200.
        service:
          type: string
          description: Stabilní technický název služby.
          example: ai-trainer-backend
        timestamp:
          type: string
          format: date-time
          description: Serverový UTC čas vytvoření odpovědi (RFC 3339).
          example: "2026-07-22T09:15:30Z"
        version:
          type: string
          description: Bezpečný release nebo build identifikátor.
          example: 0.1.0
    ReadinessResponse:
      type: object
      required: [status, service, timestamp, version, checks]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [READY]
          description: Pro R0 vždy READY při odpovědi 200.
        service:
          type: string
          example: ai-trainer-backend
        timestamp:
          type: string
          format: date-time
          example: "2026-07-22T09:15:30Z"
        version:
          type: string
          example: 0.1.0
        checks:
          type: object
          description: >
            Stav jednotlivých povinných závislostí. Množina klíčů se může
            aditivně rozšiřovat (např. database, migrations); klienti musí
            neznámé klíče ignorovat.
          additionalProperties:
            $ref: "#/components/schemas/CheckStatus"
          example:
            application: UP
            database: UP
            migrations: UP
    CheckStatus:
      type: string
      enum: [UP, DOWN]
    RegistrationRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: First-party přihlašovací identifikátor (EMAIL_PASSWORD baseline).
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 200
          description: Nikdy se neloguje ani neukládá jako plaintext (AAC-009).
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 200
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          format: password
          maxLength: 512
          description: >
            Refresh credential; přenáší se výhradně v tomto body (AAC-010),
            nikdy v URL ani v logu.
    AuthSessionResponse:
      type: object
      required: [accountId, sessionId, accessToken, accessExpiresAt, refreshToken, refreshExpiresAt]
      additionalProperties: false
      properties:
        accountId:
          type: string
          description: Server-assigned identifikátor účtu (SDM-005 server-only entita).
        sessionId:
          type: string
          description: Server-assigned identifikátor aplikační auth session.
        accessToken:
          type: string
          format: password
          description: Krátce žijící access credential (AAC-006).
        accessExpiresAt:
          type: string
          format: date-time
          description: UTC expirace access credential.
        refreshToken:
          type: string
          format: password
          description: Rotující refresh credential (AAC-006, AAC-010).
        refreshExpiresAt:
          type: string
          format: date-time
          description: UTC absolutní expirace refresh session.
    SessionContextResponse:
      type: object
      required: [accountId, sessionId, accountType, accountStatus, accessExpiresAt]
      additionalProperties: false
      properties:
        accountId:
          type: string
        sessionId:
          type: string
        accountType:
          type: string
          enum: [ANONYMOUS, STANDARD]
          description: R2 baseline typy účtu (C6 §7.1).
        accountStatus:
          type: string
          enum: [ACTIVE, ONBOARDING, LIMITED, SUSPENDED, LOCKED, DELETION_PENDING, DELETED]
        accessExpiresAt:
          type: string
          format: date-time
    CreateProfileRequest:
      type: object
      required: [profileId, displayName]
      additionalProperties: false
      properties:
        profileId:
          type: string
          format: uuid
          description: Client-generated stabilní ID profilu (SDM-005).
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        primarySport:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,39}$"
          description: Stabilní kód primárního sportu.
        experienceLevel:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{0,39}$"
          description: Stabilní kód úrovně zkušenosti.
        units:
          type: string
          enum: [METRIC, IMPERIAL]
        timezone:
          type: string
          maxLength: 60
        locale:
          type: string
          maxLength: 20
    ProfileResponse:
      type: object
      required: [profileId, accountId, profileType, status, displayName, createdAt, updatedAt]
      additionalProperties: false
      properties:
        profileId:
          type: string
        accountId:
          type: string
        profileType:
          type: string
          enum: [SELF]
        status:
          type: string
          enum: [ACTIVE]
        displayName:
          type: string
        primarySport:
          type: string
          nullable: true
        experienceLevel:
          type: string
          nullable: true
        units:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegisterDeviceRequest:
      type: object
      required: [platform, appVersion, localSchemaVersion]
      additionalProperties: false
      properties:
        platform:
          type: string
          enum: [IOS, ANDROID]
          description: R2 baseline platformy (C9 §8); další append-only.
        appVersion:
          type: string
          minLength: 1
          maxLength: 60
        localSchemaVersion:
          type: string
          minLength: 1
          maxLength: 60
          description: Verze lokálního datového schématu pro sync kompatibilitu (C10).
    DeviceResponse:
      type: object
      required: [installationId, platform, appVersion, localSchemaVersion, status, createdAt, lastSeenAt]
      additionalProperties: false
      properties:
        installationId:
          type: string
        platform:
          type: string
          enum: [IOS, ANDROID]
        appVersion:
          type: string
        localSchemaVersion:
          type: string
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    DeviceListResponse:
      type: object
      required: [devices]
      additionalProperties: false
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceResponse"
    SyncOperation:
      type: object
      required: [operationId, idempotencyKey, sequence, operationType, entityType, entityId, payload]
      additionalProperties: false
      properties:
        operationId:
          type: string
          description: Client-generated ID operace (outbox položka, C2).
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
          description: Stabilní klíč operace (LSM-008, C11).
        sequence:
          type: integer
          format: int64
          description: Deterministické pořadí per zařízení (LSM-012, SPC-003).
        operationType:
          type: string
          enum: [CREATE_ENTITY, UPDATE_ENTITY]
          description: R2-05 podmnožina SyncOperationType (C10 §5.1).
        entityType:
          type: string
          enum: [WORKOUT_INSTANCE, WORKOUT_SESSION, STEP_PERFORMANCE, SET_PERFORMANCE, WORKOUT_FEEDBACK, ACTIVITY_SUMMARY, USER_SPORT, GOAL, AVAILABILITY_RULE, EQUIPMENT_ITEM, CONSTRAINT_ITEM, TRAINING_PLAN, CALENDAR_CHANGE, MANUAL_ACTIVITY, DAILY_CHECK_IN]
        entityId:
          type: string
          format: uuid
          description: Client-generated ID entity — server jej zachovává (SDM-005).
        payload:
          type: object
          additionalProperties: true
          description: Plný aktuální stav entity (state-based push, C10 §5.3); server jej v P0 nereinterpretuje.
        expectedServerVersion:
          type: integer
          format: int64
          nullable: true
          description: Verze, nad kterou klient operoval; null pro CREATE (C10 §10).
    SyncPushRequest:
      type: object
      required: [installationId, operations]
      additionalProperties: false
      properties:
        installationId:
          type: string
          format: uuid
          description: Registrovaná instalace (C9); technická reference, ne autorizace (DRC-009).
        operations:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/SyncOperation"
    SyncItemOutcome:
      type: object
      required: [operationId, result]
      additionalProperties: false
      properties:
        operationId:
          type: string
        result:
          type: string
          enum: [SUCCESS, ALREADY_APPLIED, VERSION_CONFLICT, VALIDATION_FAILED, PERMISSION_DENIED, DEPENDENCY_FAILED]
          description: R2-05 podmnožina SyncResult (C10 §7).
        serverVersion:
          type: integer
          format: int64
          nullable: true
          description: Autoritativní verze po SUCCESS/ALREADY_APPLIED; u VERSION_CONFLICT aktuální serverová verze.
    SyncPushResponse:
      type: object
      required: [results]
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncItemOutcome"
    PlanProposalRequest:
      type: object
      required: [context]
      additionalProperties: false
      properties:
        context:
          type: object
          description: >
            Minimalizovaný autorizovaný AIContext (C27/C36) stavěný klientem
            z lokálních dat — by-value bez identifikátorů a poznámek;
            server ho nečte, jen zprostředkuje modelu (AGW-014).
        requestType:
          type: string
          enum: [PLAN_PROPOSAL, ADJUSTMENT_PROPOSAL]
          default: PLAN_PROPOSAL
          description: Typ AI požadavku (C37 §2) — jediný endpoint, typ v requestu.
    PlanProposalResponse:
      type: object
      required: [proposal, promptVersion, schemaVersion, modelId]
      additionalProperties: false
      properties:
        proposal:
          type: object
          description: >
            Kanonický validovaný návrh dle `plan-proposal-schema-v1`
            (C28 §2) — jediné, co smí pokračovat do review a execution.
        promptVersion:
          type: string
        schemaVersion:
          type: string
        modelId:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, requestId, timestamp]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: Stabilní machine-readable kód (APR-006).
          example: SERVICE_NOT_READY
        message:
          type: string
          description: Bezpečná obecná zpráva bez interních detailů.
          example: Service is not ready to accept traffic.
        requestId:
          type: string
          maxLength: 128
          description: Korelační ID shodné s X-Request-Id headerem.
          example: 01J3EXAMPLE8R0REQUESTID
        timestamp:
          type: string
          format: date-time
          example: "2026-07-22T09:15:30Z"
        details:
          type: array
          description: Strukturované bezpečné detaily, pouze pokud je kontrakt definuje.
          items:
            type: object
            additionalProperties: true
